<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夕阳</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            padding: 10px;
        }

        /* 图片统一自适应 */
        img {
            max-width: 100%;
            height: auto;
        }

        .center {
            text-align: center;
            margin: 15px 0;
        }

        .title {
            text-align: center;
            margin: 10px 0 20px;
            font-size: 18px;
        }

        .back-home {
            display: inline-block;
            margin: 10px 0;
            text-decoration: none;
            color: #007bff;
        }

        hr {
            max-width: 100%;
            height: 3px;
            background-color: red;
            border: none;
            margin: 20px auto;
        }

        textarea {
            width: 100%;
            max-width: 600px;
            margin: 8px auto;
            display: block;
            padding: 6px;
            font-size: 14px;
        }

        .radio-group {
            text-align: center;
            margin-top: 8px;
        }

        /* 手机端微调 */
        @media screen and (max-width: 768px) {
            .title {
                font-size: 16px;
            }

            textarea {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="center">
        <img src="img/xiyang.jpg" alt="落日">
    </div>

    <p class="title">
        <b>夕阳很美</b><br>
        但却没有一个人陪你看
    </p>

    <div class="center">
        <a href="GA.html" class="back-home">← 返回主页</a>
    </div>

    <hr>

    <form>
        <textarea rows="1">今年还是一个人吗?</textarea>

        <div class="radio-group">
            <label>
                <input type="radio" name="xuanze" value="1"> 一个人
            </label>
            &nbsp;&nbsp;
            <label>
                <input type="radio" name="xuanze" value="2"> 两个人
            </label>
        </div>
    </form>

    <form>
        <textarea rows="6">
或许我们都对爱情想得有点多了，因为每个人都希望有一个甜甜的爱情，可是大多数人都没有如愿，或许是没遇到对的人，也可能是自己的原因。

有时候我也会羡慕那些甜甜的恋爱，但人总是羡慕自己没有的。现在我已经不再执着这些了，我只想把编程学好。

也许很难，但我一定可以。经历了一些事，让我明白了很多东西，这条路，我会坚持走下去。
        </textarea>
    </form>

    <div class="center">
        <img src="img/GA.jpg" alt="GA">
    </div>

</body>
</html>
