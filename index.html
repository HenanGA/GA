<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .back {
            background-image: url(img/背景.png);
            background-size: cover;
            background-position: center;
        }

        .container {
            background-color: #86aacb;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 头图 */
        .header img {
            width: 100%;
            height: auto;
        }

        /* 导航 */
        .one-nav {
            width: 100%;
            height: 40px;
            margin-bottom: 5px;
            text-align: center;
            background: black;
        }

        .one-nav a {
            line-height: 40px;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            padding: 0 10px;
            color: white;
        }

        .one-nav a:hover {
            color: palevioletred;
            background-color: pink;
        }

        .nav,
        .nav2 {
            width: 50%;
            height: 30px;
            background-color: black;
            color: white;
            line-height: 30px;
            float: left;
            padding-left: 10px;
        }

        .main {
            overflow: hidden;
            padding: 10px;
        }

        /* 左右布局（PC） */
        .left {
            float: left;
            width: 35%;
        }

        .left img {
            width: 100%;
            height: auto;
        }

        .left p {
            margin: 5px;
        }

        .left audio {
            width: 100%;
            margin-top: 20px;
        }

        #right {
            float: right;
            width: 63%;
            font-size: 16px;
        }

        #right p {
            margin: 1em 0;
            text-indent: 2em;
            text-align: left;
        }

        #right img {
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        #right img.tupian {
            width: 100%;
            height: auto;
        }

        /* ================== 手机端适配 ================== */
        @media screen and (max-width: 768px) {

            .nav,
            .nav2 {
                width: 100%;
                float: none;
                text-align: center;
            }

            .left,
            #right {
                width: 100%;
                float: none;
            }

            .one-nav a {
                font-size: 16px;
                padding: 0 6px;
            }

            #right p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
<div class="back">
    <div class="container">

        <div class="header">
            <img src="img/个人简介图片.png" alt="">
        </div>

        <div class="one-nav">
            <a href="GA.html">主页</a>
            <a href="实操一.html">介绍</a>
        </div>

        <div class="nav"><b>关于我</b></div>
        <div class="nav2"><b>热爱生活</b></div>

        <div class="main">

            <div class="left">
                <img src="img/头像.png" alt="头像">
                <p><b>姓名：</b>GA</p>
                <p><b>性别：</b>男</p>
                <p><b>爱好：</b>听歌，写编程，体验生活</p>
                <p><b>性格：</b>有时开朗，有时冷漠</p>
                <p><b>家乡：</b>河南-桐柏</p>
                <p><b>专业：</b>计算机</p>

                <audio controls>
                    <source src="music/阿軒%20-%20别感动自己%20(V0).mp3" type="audio/mpeg">
                    你的浏览器不支持音频播放
                </audio>
            </div>

            <div id="right">
                <img src="img/右边图片.png" alt="">

                <p><b>一、在这个诺大的城市，有时我喜欢一个人去一个地方独处，享受属于自己的时光。</b></p>
                <p><b>二、我相信未来的某一天，会感谢现在努力学习的你！</b></p>
                <p><b>三、总会有一件事让你瞬间长大，也总会有一个人让你泪如雨下。</b></p>
                <p><b>四、岁月从来不曾静好，只是有人在替你负重前行。</b></p>

                <img src="img/生活.png" alt="" class="tupian">
            </div>

        </div>
    </div>
</div>
</body>
</html>
